name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: JunkMountain-Windows
          path: release/*.exe
      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: Junk Mountain ${{ github.ref_name }}
          body: |
            Download **JunkMountainSetup** below and run it.
            Windows may show "Windows protected your PC" because the game isn't code-signed: click **More info → Run anyway**.
